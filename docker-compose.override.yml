# Development overrides — applied automatically by docker compose
# Enables hot-reload by mounting source directories as volumes

services:
  migrate:
    # --transpile-only on the seed: backend depends on migrate completing successfully, so a
    # type error anywhere in seed.ts's import graph would block the whole stack from starting.
    # The Dockerfile already declines to gate on tsc (`npx tsc ... || true`), so type-checking
    # here would be a stricter bar than the build itself applies.
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npx ts-node --transpile-only prisma/seed.ts"]
    volumes:
      # Mount prisma/ and src/ so migrate sees migrations, seed.ts, and the helpers seed.ts
      # imports (e.g. src/utils/categoryStyle) as written since the image was built.
      # node_modules is NOT mounted, so the container uses its own copy rather than the macOS
      # host's. Note the image's node_modules is not guaranteed pure-Linux either — there is no
      # .dockerignore, so `COPY . .` copies the host tree in; it works because the Dockerfile
      # re-runs `prisma generate` inside Linux afterwards.
      # `prisma generate` must run first here: the mounted schema/seed may reference fields the
      # image's generated client does not know about.
      - ./backend/prisma:/app/prisma
      - ./backend/src:/app/src

  backend:
    build:
      context: ./backend
      target: builder
    # prisma generate at CONTAINER START: prisma/ is bind-mounted from the host but
    # node_modules comes from the image, so an edit to schema.prisma leaves the generated
    # client stale until the image is rebuilt. Running it here re-syncs on every start and
    # survives `docker compose down`, which discards the container layer.
    # Caveat: this does NOT cover editing schema.prisma while the stack is up. ts-node-dev
    # only watches the require() graph, and its --respawn restarts the app child only — the
    # shell has already exec'd away, so generate does not re-run. After a schema edit use
    # `make generate` (or `make restart`).
    command: ["sh", "-c", "npx prisma generate && npx ts-node-dev --respawn --transpile-only --poll src/index.ts"]
    # --poll: virtiofs/osxfs on Docker for Mac doesn't reliably deliver inotify events,
    #         so use stat-based polling to ensure hot-reload detects source file changes.
    volumes:
      # Mount only source dirs — container keeps its own node_modules (correct Linux binaries)
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    environment:
      NODE_ENV: development

  frontend:
    build:
      context: ./frontend
      target: builder
    # `npm install` before Vite, for the same reason the backend runs `prisma generate`
    # here: node_modules comes from the image while the source is bind-mounted, so adding
    # a dependency on the host leaves the container unable to resolve it and the whole app
    # fails to load. It is a no-op (~1s) when nothing has changed.
    command: ["sh", "-c", "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"]
    volumes:
      # Mount only source dirs — container keeps its own node_modules
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # index.html is Vite's entry document and is edited like source, but it lives at the
      # project root rather than under src/. Without this mount it stays frozen at whatever
      # the image was built with, so a change here appears in tests and in the repo while
      # the running app silently serves the old one. That is how the `lang` attribute --
      # which decides the format of every native <input type="date"> -- went on rendering
      # mm/dd/yyyy after it had already been fixed.
      - ./frontend/index.html:/app/index.html
      # Mounted so the install above sees dependencies added on the host. node_modules is
      # deliberately NOT mounted — it must stay Linux-native inside the container rather
      # than the macOS host's copy.
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    environment:
      NODE_ENV: development
      # CHOKIDAR_USEPOLLING: same virtiofs fix for Vite's chokidar file watcher
      CHOKIDAR_USEPOLLING: "true"
