server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Outer cap only — the real per-route limits live in the backend (15MB import,
    # 10MB documents) and this must stay >= the largest of them. A body over it is
    # rejected HERE, before the backend sees it, so answer in the API's JSON envelope
    # instead of nginx's HTML page (the client would otherwise show a generic error).
    # Backend 413s still pass through untouched: proxy_intercept_errors stays off.
    client_max_body_size 20M;
    error_page 413 @too_large;

    location @too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"File too large","code":"FILE_TOO_LARGE"}';
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Cache fingerprinted assets aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other requests fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
