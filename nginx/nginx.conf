server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream http://backend:3000;
    set $frontend_upstream http://frontend:5173;

    # Outer cap only — the real per-route limits live in the backend (15MB import,
    # 10MB documents) and this must stay >= the largest of them. A body over it is
    # rejected HERE, before the backend sees it, so answer in the API's JSON envelope
    # instead of nginx's HTML page (the client would otherwise show a generic error).
    # Backend 413s still pass through untouched: proxy_intercept_errors stays off.
    client_max_body_size 20M;
    error_page 413 @too_large;

    location @too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"File too large","code":"FILE_TOO_LARGE"}';
    }

    # Health check endpoint (bypass to backend)
    location /api/health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API traffic → backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # All other traffic → frontend (Vite dev server in dev, static files in prod)
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
